name: generate profile assets

on:
  # Berjalan otomatis setiap 12 jam
  schedule:
    - cron: "0 */12 * * *" 
  
  # Memungkinkan kita memancing jalan manual kapan saja lewat tab Actions
  workflow_dispatch:
  
  # Terpicu setiap kali ada push di branch utama
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 1: Generate animasi Snake Game
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: zzeeyyaa
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # STEP 2: Generate GitHub Stats Card & Top Languages (Bar Chart) secara lokal
      - name: generate github-readme-stats cards
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: zzeeyyaa
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          
          # Pengaturan untuk Top Languages (Bar Chart)
          plugin_languages: yes
          plugin_languages_ignored: css, html
          plugin_languages_details: bytes-percentage, lines
          plugin_languages_limit: 8
          
          # Output file tujuan di dalam folder dist
          output_action: none
          filename: dist/github-readme-stats.svg

      # STEP 3: Push semua hasil (.svg) ke branch 'output'
      - name: push assets to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
