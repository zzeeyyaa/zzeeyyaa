name: generate profile assets
on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main
    - master
jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # STEP 1: Generate animasi Snake Game
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: zzeeyyaa
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      # STEP 2: Generate Card 1 - GitHub Stats
      - name: generate github stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: zzeeyyaa
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          output_action: none
          filename: dist/github-stats.svg
      # STEP 3: Generate Card 2 - Top Languages (Bar Chart)
      - name: generate top languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: zzeeyyaa
          template: classic
          base: "" 
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_ignored: css, html
          plugin_languages_details: bytes-percentage
          plugin_languages_limit: 8
          output_action: none
          filename: dist/github-top-langs.svg
      # STEP 3.5: Debug - cek file svg apa aja yang ada di workspace
      - name: Debug list svg files
        run: find . -name "*.svg" -not -path "*/node_modules/*"
      # STEP 4: Push semua hasil (.svg) ke branch 'output'
      - name: push assets to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
